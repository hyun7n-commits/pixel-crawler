<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽셀 던전 크롤러</title>
<meta name="theme-color" content="#14121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="픽셀 던전">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section id="game" hidden aria-label="들판">
    <div id="mtop" aria-hidden="true">
      <div class="mt-row"><span id="mFloor"></span><span id="mStatus"></span><b id="mGold"></b></div>
      <div class="mt-hp"><div class="bar" id="mHp"><i></i></div><span id="mHpText"></span></div>
      <div class="bar" id="mXp"><i></i></div>
    </div>
    <div id="stage"><div id="phaser"></div><div id="iris" hidden></div><div id="danger"></div><div id="banner"></div><div id="fallen" hidden></div><div id="tip" hidden></div><div id="mtray" hidden aria-label="도구"></div><div id="mlog" aria-hidden="true"></div>
      <div id="vhud"><div class="vh-top"><span class="vh-place">마을<small>v0.25</small></span><span class="purse" id="vPurse"></span><button type="button" class="btn" id="vSound">소리 켬</button></div><button type="button" class="btn primary enter" id="vGo">들판에 출발</button></div>
    </div>
    <div id="mbar" aria-label="행동"></div>
    <div id="shade"></div>
    <aside id="side">
      <div class="bag-head"><b>가방</b><button type="button" class="btn" id="bagClose">닫기</button></div>
      <div class="hud-top"><div class="floor" id="floorLabel"></div><div class="gold-now" id="goldNow"></div></div>
      <div class="meter"><div class="meter-label"><span>체력</span><b id="hpText"></b></div><div class="bar" id="hpbar"><i></i></div></div>
      <div class="meter"><div class="meter-label"><span id="lvText"></span><span id="atkText"></span></div><div class="bar" id="xpbar"><i></i></div></div>
      <div id="pstatus" aria-live="polite"></div>
      <div id="quests"></div>
      <div class="sec-title"><span>유물</span><span id="slotText"></span></div>
      <div class="relics" id="relics"></div>
      <div id="relicInfo">유물을 누르면 효과와 짝꿍 유물이 보인다.</div>
      <div class="sec-title"><span>소모품</span></div>
      <div class="items" id="items"></div>
      <div class="actions"><button type="button" class="btn" id="waitBtn" title="한 턴 쉰다 (스페이스)">쉬기</button><button type="button" class="btn" id="lookBtn" title="누른 다음 맵을 누르면 그게 뭔지 본다 (L)">살펴보기</button><button type="button" class="btn" id="quitBtn" title="저장하고 마을로 가거나 탐험을 포기한다">나가기</button><button type="button" class="btn" id="soundBtn" title="M 키로도 켜고 끈다">소리 켬</button><button type="button" class="btn" id="speedBtn" title="F 키로도 바꾼다">배속 1x</button></div>
      <div id="log" aria-live="polite"></div>
    </aside>
  </section>
  <div id="modal" hidden></div>
</div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
